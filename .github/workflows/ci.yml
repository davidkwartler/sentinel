name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: CI only checks out and tests
permissions:
  contents: read

# A new push to a PR cancels its older run; main always finishes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Lint, types, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # Production dependencies only: dev tooling can carry advisories with
      # no patched release that never reach the deployed app
      - run: npm audit --omit=dev --audit-level=high

  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run
      # No secrets needed: every data-bearing route renders on demand, so the
      # build never opens a database connection or calls an external API.
      - run: npm run build
